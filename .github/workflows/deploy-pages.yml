# Menu #164 step 3 — favourites persistence 2026-10-03
name: Deploy Cooking Confidential staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-staging
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging workflow repository
        uses: actions/checkout@v4

      - name: Check out Cooking Confidential development branch
        uses: actions/checkout@v4
        with:
          repository: sunilbane19/CookingConfidential
          ref: rescue-ocr-fallback-test
          path: site

      - name: Remove production custom domain
        run: rm -f site/CNAME

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Generate PWA PNG icons
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 192 -h 192 site/pwa-icon.svg -o site/pwa-icon-192.png
          rsvg-convert -w 512 -h 512 site/pwa-icon.svg -o site/pwa-icon-512.png

      - name: Upload staging site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy staging site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

