name: Deploy Cooking Confidential staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-staging
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging workflow repository
        uses: actions/checkout@v4

      - name: Check out Cooking Confidential development branch
        uses: actions/checkout@v4
        with:
          repository: sunilbane19/CookingConfidential
          ref: egress-optimization
          path: site

      - name: Remove production custom domain
        run: rm -f site/CNAME

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload staging site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy staging site
        id: deployment
        uses: actions/deploy-pages@v4

